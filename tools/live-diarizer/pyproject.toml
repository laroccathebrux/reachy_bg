[project]
name = "live-diarizer"
version = "0.1.0"
description = "Streaming speaker diarization sidecar for reachy_bg (diart + pyannote 3) publishing speaker turns over WebSocket"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Pinned separately from the main project: diart needs numpy < 2 while reachy-mini needs
# numpy >= 2.2, so this runs as its own process in its own virtual environment.
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "numpy==1.26.4",
    "pyannote.audio==3.4.0",
    "diart==0.9.2",
    "sounddevice>=0.5",
    "websockets>=13",
    "python-dotenv>=1.0",
    # pyannote.core 5 still imports matplotlib.cm.get_cmap, removed in matplotlib 3.9
    "matplotlib<3.9",
    # pyannote.audio 3.4 still calls hf_hub_download(use_auth_token=...), gone in huggingface_hub 1.x
    "huggingface_hub>=0.24,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
